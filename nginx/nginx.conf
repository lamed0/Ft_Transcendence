events {
    worker_connections 1024;
}

http {
    # include       mime.types;
    default_type  application/octet-stream;

    # ==============================
    # 🛡️ WAF: SECURITY ZONES
    # ==============================
    
    # 1. Rate Limiting (DDoS Protection)
    # Allows 10 requests per second per IP. Bursts up to 20.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # 2. Block Common Attack Patterns (Basic WAF)
    # Exclude OAuth callbacks from WAF to prevent token blocking
    map $request_uri $skip_waf {
        default 0;
        ~*/auth/google/callback 1;
        ~*/auth/42/callback 1;
    }

    map $request_uri $block_sql_injections {
        default 0;
        ~*union.*select.*\( 1;
        ~*union.*all.*select 1;
        ~*concat.*\( 1;
    }

    # 3. Block Bad User Agents (Scrapers)
    map $http_user_agent $bad_bot {
        default 0;
        ~*malicious 1;
        ~*backdoor 1;
        ~*netcrawler 1;
        ~*Antivirx 1;
        ~*AhrefsBot 1;
    }

    # ==============================
    # 🚀 SERVER CONFIGURATION
    # ==============================
    server {
        listen 443 ssl;
        server_name localhost;

        # SSL Certificates
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

        # SSL Hardening (The good stuff)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # 🛡️ SECURITY HEADERS (Helmet for Nginx)
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ==============================
        # 🔗 ROUTING (Reverse Proxy)
        # ==============================

        # 0. Socket.io Services - MUST be before generic /
        
        # Game Service Socket.io
        location ^~ /socket.io/ {
            # Forward to the Game Service
            proxy_pass http://game:3005;

            # Enable WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;  # Forward cookies
            proxy_cookie_path / "/";
            proxy_cookie_domain ~^(.*)$ "localhost";

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
            proxy_cache_bypass $http_upgrade;
        }

        # Friends Service - Connect to friends service directly
        location ^~ /friends/socket.io/ {
            # Rewrite /friends/socket.io -> /socket.io/ for the friends service
            rewrite ^/friends/socket.io/(.*) /socket.io/$1 break;
            proxy_pass http://friends:3003;

            # Enable WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;  # Forward cookies
            proxy_cookie_path / "/";
            proxy_cookie_domain ~^(.*)$ "localhost";

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
            proxy_cache_bypass $http_upgrade;
        }

        # 1. Frontend (Vite/React)
        location / {
            proxy_pass http://front:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }


        # 2. Backend API (Auth, Users, etc.)
        location /api/ {
            # Apply Rate Limiting here
            limit_req zone=api_limit burst=20 nodelay;

            # 🚫 WAF: Block bad bots
            if ($bad_bot) {
                return 403;
            }

            # Rewrite /api/auth -> /auth (but NOT for socket.io)
            rewrite ^/api/(?!socket\.io)(.*) /$1 break;

            # Forward to Gateway (or Auth service directly if you prefer)
            proxy_pass http://gateway:3000;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            
            # Timeouts to prevent 504 errors
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Disable buffering for WebSocket
            proxy_buffering off;
            proxy_request_buffering off;

        }
        # Favicon - serve directly from file
        location = /favicon.ico {
            alias /usr/share/nginx/html/favicon.ico;
            add_header Cache-Control "public, max-age=86400";
            access_log off;
        }
        location /ping/ {
            proxy_pass http://game_server:8082/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ping-solo/ {
            proxy_pass http://game_server_solo:8083/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Ping game (WebSocket)
        location /ping-ws/ {
            proxy_pass http://game_server:5001/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # 6. Ping game solo (WebSocket)
        location /ping-solo-ws/ {
            proxy_pass http://game_server_solo:5002/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }

    # Redirect HTTP -> HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }
}
